# CI — the suites that already run before every commit, run for every pull request too.
# `test`: the unit and conformance suites of both workspaces, and the generated token
# CSS checked against its sources (seconds). `e2e`: the package's Playwright suites in
# three shards, and the docs app's own, each against a dev server the Playwright config
# starts (minutes). The ruleset on main requires `test`; the e2e jobs report until they
# have proved steady on the runner.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the generated token CSS is committed; regenerating must change nothing
      - run: pnpm tokens
      - run: git diff --exit-code -- packages/tsugite/styles packages/tsugite/docs/tokens.generated.md packages/tsugite/components/Surface/Surface.generated.css
      - run: pnpm test

  e2e:
    # The package's conformance suites: 417 tests, each with axe. On a two-core runner
    # they need sharding to finish inside a coffee; three shards, one server each.
    name: e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tsugite exec playwright install --with-deps chromium
      - run: pnpm --filter tsugite exec playwright test --shard=${{ matrix.shard }}/3 --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-tsugite-${{ matrix.shard }}
          path: packages/tsugite/test-results
          retention-days: 7

  e2e-docs:
    # The docs app's own rooms: eleven tests, one server.
    name: e2e (docs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs exec playwright install --with-deps chromium
      - run: pnpm --filter docs exec playwright test --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-docs
          path: apps/docs/test-results
          retention-days: 7
