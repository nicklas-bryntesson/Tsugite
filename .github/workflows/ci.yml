# CI — the suites that already run before every commit, run for every pull request too.
# Two jobs: the unit and conformance suites of both workspaces (seconds), and the
# Playwright suites against a dev server (minutes). The ruleset on main requires the
# first; the second reports and can be required once it has proved steady.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the generated token CSS is committed; regenerating must change nothing
      - run: pnpm tokens
      - run: git diff --exit-code -- packages/tsugite/styles packages/tsugite/docs/tokens.generated.md packages/tsugite/components/Surface/Surface.generated.css
      - run: pnpm test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter tsugite exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            packages/tsugite/test-results
            apps/docs/test-results
          retention-days: 7
